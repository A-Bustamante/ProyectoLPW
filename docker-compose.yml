version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inventario_db
    environment:
      POSTGRES_DB: inventario_db
      POSTGRES_USER: inventario_user
      POSTGRES_PASSWORD: inventario_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: inventario_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: inventario_web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://inventario_user:inventario_password@db:5432/inventario_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-ti-asset-inventory-secret-key-2026
      - DEBUG=True
    depends_on:
      - db
      - redis

volumes:
  pgdata:
